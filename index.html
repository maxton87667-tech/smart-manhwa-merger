<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Merger Pro V4 - Smart AI Edition</title>
    <!-- 
        NOTE: For complete offline use, download these libraries 
        (jszip.min.js and opencv.js) and link them locally.
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-color: #e0e0e0;
            --border-color: #333;
            --danger-color: #cf6679;
            --success-color: #03dac6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            color: var(--primary-color);
            margin: 0 0 10px 0;
        }

        .panel {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"], input[type="number"], select {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        input[type="range"] { width: 100%; }

        .btn {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.8; }
        .btn:disabled { background-color: #555; cursor: not-allowed; color: #888; }

        .episode-container {
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px 15px;
            margin-bottom: 10px;
            background-color: #252525;
            display: flex;
            justify-content: space-between;
        }

        .progress-container { display: none; margin-top: 20px; }
        .progress-bar {
            width: 100%; height: 20px; background-color: var(--bg-color);
            border-radius: 10px; overflow: hidden; margin-top: 10px;
        }
        .progress-fill {
            height: 100%; background-color: var(--success-color); width: 0%; transition: width 0.3s;
        }

        #status-text { text-align: center; font-weight: bold; margin-top: 10px; color: var(--success-color); }
        .debug-panel {
            display: none; background: #000; color: #0f0; font-family: monospace;
            padding: 15px; border-radius: 4px; height: 200px; overflow-y: auto; margin-top: 20px;
        }
        .engine-status {
            display: inline-block; padding: 5px 10px; border-radius: 15px; font-size: 0.8em;
            background: #cf6679; color: white; margin-left: 10px;
        }
        .engine-ready { background: var(--success-color); color: black; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Manhwa Merger Pro V4 <span class="engine-status" id="engine-badge">AI Engine Loading...</span></h1>
        <p>Smart AI Edition - Folder Automation & Reverse Z-Index Engine</p>
    </header>

    <div class="panel">
        <h3>Export Settings</h3>
        <div class="settings-grid">
            <div class="setting-group">
                <label>ZIP Name (e.g., mkd81-85)</label>
                <input type="text" id="zip-name" placeholder="Leave blank for auto-name">
            </div>
            <div class="setting-group">
                <label>Output Format</label>
                <select id="out-format">
                    <option value="image/webp">WebP (Recommended)</option>
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/png">PNG</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Output Width (px)</label>
                <input type="number" id="out-width" value="720" min="400" max="3000">
            </div>
            <div class="setting-group">
                <label>Quality (<span id="quality-val">90</span>%)</label>
                <input type="range" id="out-quality" min="10" max="100" value="90" oninput="document.getElementById('quality-val').innerText = this.value">
            </div>
            <div class="setting-group">
                <label>Advanced</label>
                <label style="font-weight: normal;">
                    <input type="checkbox" id="debug-mode" onchange="toggleDebug()"> Enable Debug Mode
                </label>
            </div>
        </div>
    </div>

    <div class="panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h3>Folder Selector</h3>
                <p style="font-size: 0.85em; color: #aaa; margin-top: 5px;">Select the main folder containing your chapter subfolders (1, 2, 3...).</p>
            </div>
            <label class="btn" style="cursor: pointer; padding: 15px 30px; font-size: 1.1em;">
                Select Main Folder
                <!-- Directory upload feature -->
                <input type="file" webkitdirectory directory multiple style="display: none;" onchange="handleFolderSelect(this)">
            </label>
        </div>
        <div id="episodes-wrapper">
            <div style="text-align: center; color: #666; padding: 20px;">No folder selected yet.</div>
        </div>
    </div>

    <div style="text-align: center; margin-top: 30px;">
        <button class="btn" id="merge-btn" style="font-size: 1.2em; padding: 15px 40px;" onclick="startProcess()" disabled>Merge & Export ZIP</button>
    </div>

    <div class="panel progress-container" id="progress-panel">
        <h3 id="current-task">Initializing...</h3>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div id="status-text">0%</div>
    </div>

    <div class="debug-panel" id="debug-console">
        <div>[System] Ready. Waiting for input...</div>
    </div>
</div>

<script>
    let cvReady = false;
    let chaptersData = []; // Will store parsed folder data
    let watermarkImg = null;

    // Auto-load watermark.png
    const wm = new Image();
    wm.onload = () => { watermarkImg = wm; logDebug("[System] watermark.png loaded successfully."); };
    wm.onerror = () => { logDebug("[System] watermark.png not found. Continuing without watermark."); };
    wm.src = 'watermark.png';

    function onOpenCvReady() {
        cvReady = true;
        const badge = document.getElementById('engine-badge');
        badge.textContent = "AI Engine Active";
        badge.classList.add('engine-ready');
        logDebug("[CV] OpenCV.js initialized.");
    }

    function toggleDebug() {
        const isDebug = document.getElementById('debug-mode').checked;
        document.getElementById('debug-console').style.display = isDebug ? 'block' : 'none';
    }

    function logDebug(msg) {
        if (!document.getElementById('debug-mode').checked) return;
        const consoleEl = document.getElementById('debug-console');
        const time = new Date().toISOString().split('T')[1].substring(0,8);
        consoleEl.innerHTML += `<div>[${time}] ${msg}</div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    // Smart Folder Parsing
    function handleFolderSelect(input) {
        const files = Array.from(input.files);
        const folderGroups = {};

        files.forEach(file => {
            if (!file.type.startsWith('image/')) return;
            
            // Expected format: "mkd81-85/1/IMG1.jpg"
            const parts = file.webkitRelativePath.split('/');
            if (parts.length >= 3) {
                const subFolder = parts[1]; // The chapter folder (e.g., "1", "2")
                if (!folderGroups[subFolder]) folderGroups[subFolder] = [];
                folderGroups[subFolder].push(file);
            }
        });

        // Sort subfolders numerically
        const sortedFolders = Object.keys(folderGroups).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
        chaptersData = [];
        const wrapper = document.getElementById('episodes-wrapper');
        wrapper.innerHTML = '';

        sortedFolders.forEach((folderName) => {
            // Natural sort images (Perfectly handles IMG1 vs IMG10 or random numbers)
            let epFiles = folderGroups[folderName].sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true}));
            chaptersData.push({ originalName: folderName, files: epFiles });
            
            const epDiv = document.createElement('div');
            epDiv.className = 'episode-container';
            epDiv.innerHTML = `<span><strong>Folder: ${folderName}</strong></span> <span>${epFiles.length} images</span>`;
            wrapper.appendChild(epDiv);
        });

        logDebug(`[System] Loaded ${chaptersData.length} subfolders.`);
        if (chaptersData.length > 0 && cvReady) {
            document.getElementById('merge-btn').disabled = false;
        } else if (!cvReady) {
            alert("OpenCV AI is still loading. Please wait a few seconds.");
        }
    }

    async function loadImage(file) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = reject;
            img.src = URL.createObjectURL(file);
        });
    }

    function updateProgress(percent, taskText) {
        document.getElementById('progress-panel').style.display = 'block';
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('status-text').innerText = `${Math.round(percent)}%`;
        if (taskText) document.getElementById('current-task').innerText = taskText;
    }

    // OpenCV Engine
    async function calculateOverlap(imgA, imgB) {
        return new Promise((resolve) => {
            setTimeout(() => {
                let matA, matB, grayA, grayB, edgesA, edgesB, descriptorsA, descriptorsB, keypointsA, keypointsB, matches;
                try {
                    matA = cv.imread(imgA); matB = cv.imread(imgB);

                    if (matA.cols !== matB.cols) {
                        let tempB = new cv.Mat();
                        cv.resize(matB, tempB, new cv.Size(matA.cols, Math.round(matB.rows * (matA.cols / matB.cols))));
                        matB.delete(); matB = tempB;
                    }

                    let searchH = Math.min(matA.rows, matB.rows, 2000);
                    let rectA = new cv.Rect(0, matA.rows - searchH, matA.cols, searchH);
                    let rectB = new cv.Rect(0, 0, matB.cols, searchH);

                    let roiA = matA.roi(rectA); let roiB = matB.roi(rectB);

                    grayA = new cv.Mat(); grayB = new cv.Mat();
                    cv.cvtColor(roiA, grayA, cv.COLOR_RGBA2GRAY, 0); cv.cvtColor(roiB, grayB, cv.COLOR_RGBA2GRAY, 0);

                    edgesA = new cv.Mat(); edgesB = new cv.Mat();
                    cv.Canny(grayA, edgesA, 50, 150); cv.Canny(grayB, edgesB, 50, 150);

                    let orb = new cv.ORB(2000);
                    keypointsA = new cv.KeyPointVector(); keypointsB = new cv.KeyPointVector();
                    descriptorsA = new cv.Mat(); descriptorsB = new cv.Mat();

                    orb.detectAndCompute(edgesA, new cv.Mat(), keypointsA, descriptorsA);
                    orb.detectAndCompute(edgesB, new cv.Mat(), keypointsB, descriptorsB);

                    let overlap = 0, confidence = 0;

                    if (descriptorsA.rows > 0 && descriptorsB.rows > 0) {
                        let bf = new cv.BFMatcher(cv.NORM_HAMMING, true);
                        matches = new cv.DMatchVector();
                        bf.match(descriptorsA, descriptorsB, matches);

                        let yShifts = {};
                        for (let i = 0; i < matches.size(); i++) {
                            let m = matches.get(i);
                            let ptA = keypointsA.get(m.queryIdx).pt;
                            let ptB = keypointsB.get(m.trainIdx).pt;

                            if (Math.abs(ptA.x - ptB.x) <= 10) {
                                let calcOverlap = Math.round(searchH - ptA.y + ptB.y);
                                if (calcOverlap > 5 && calcOverlap < searchH - 10) {
                                    yShifts[calcOverlap] = (yShifts[calcOverlap] || 0) + 1;
                                }
                            }
                        }

                        let maxVotes = 0, bestShift = 0;
                        let shiftKeys = Object.keys(yShifts).map(Number);
                        for (let s of shiftKeys) {
                            let votes = 0;
                            for (let i = -2; i <= 2; i++) if (yShifts[s + i]) votes += yShifts[s + i];
                            if (votes > maxVotes) { maxVotes = votes; bestShift = s; }
                        }
                        overlap = bestShift; confidence = maxVotes;
                    }
                    roiA.delete(); roiB.delete();
                    resolve({ overlap, confidence });

                } catch(e) {
                    console.error("CV Error:", e);
                    resolve({ overlap: 0, confidence: 0 });
                } finally {
                    if(matA) matA.delete(); if(matB) matB.delete();
                    if(grayA) grayA.delete(); if(grayB) grayB.delete();
                    if(edgesA) edgesA.delete(); if(edgesB) edgesB.delete();
                    if(descriptorsA) descriptorsA.delete(); if(descriptorsB) descriptorsB.delete();
                    if(keypointsA) keypointsA.delete(); if(keypointsB) keypointsB.delete();
                    if(matches) matches.delete();
                }
            }, 10);
        });
    }

    async function processEpisode(epFiles, chNameStr, chFolderObj) {
        const outWidth = parseInt(document.getElementById('out-width').value);
        const format = document.getElementById('out-format').value;
        const quality = parseInt(document.getElementById('out-quality').value) / 100;

        logDebug(`[Engine] Processing ${chNameStr} (${epFiles.length} images)`);

        let images = [], overlaps = [0], totalNativeHeight = 0;

        for (let i = 0; i < epFiles.length; i++) {
            let img = await loadImage(epFiles[i]);
            images.push(img);
            if (i === 0) {
                totalNativeHeight += img.height;
            } else {
                let res = await calculateOverlap(images[i-1], img);
                if (res.confidence < 3) res.overlap = 0; 
                overlaps.push(res.overlap);
                totalNativeHeight += (img.height - res.overlap);
            }
        }
        
        const MAX_SLICE_HEIGHT = 15000; 
        const nativeWidth = images[0].width;
        const scaleFactor = outWidth / nativeWidth;

        let currentCanvas = document.createElement('canvas');
        currentCanvas.width = outWidth;
        let ctx = currentCanvas.getContext('2d');
        
        let sliceIndex = 1;
        let yOffsets = [0];
        for(let i = 1; i < images.length; i++) {
            yOffsets.push(yOffsets[i-1] + images[i-1].height - overlaps[i]);
        }
        let sliceStartY = 0;

        for (let i = 0; i < images.length; i++) {
            let nativeY = yOffsets[i];
            if (nativeY - sliceStartY > MAX_SLICE_HEIGHT && i > 0) {
                currentCanvas.height = Math.round((nativeY - sliceStartY) * scaleFactor);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0,0, currentCanvas.width, currentCanvas.height);
                
                // REVERSE LOOP for hiding artifacts
                for(let j = i - 1; j >= 0; j--) {
                    let drawY = yOffsets[j] - sliceStartY;
                    if (drawY + images[j].height > 0 && drawY < (nativeY - sliceStartY)) {
                        ctx.drawImage(images[j], 0, drawY * scaleFactor, outWidth, images[j].height * scaleFactor);
                    }
                }

                // Updated Watermark logic (30% opacity, bottom right)
                if (watermarkImg) {
                    let wmWidth = Math.min(outWidth * 0.3, watermarkImg.width);
                    let wmHeight = watermarkImg.height * (wmWidth / watermarkImg.width);
                    ctx.globalAlpha = 0.3; // Changed to 30%
                    ctx.drawImage(watermarkImg, outWidth - wmWidth - 20, currentCanvas.height - wmHeight - 20, wmWidth, wmHeight);
                    ctx.globalAlpha = 1.0;
                }

                await exportCanvasToZip(currentCanvas, chFolderObj, sliceIndex, format, quality);
                sliceIndex++;
                sliceStartY = nativeY; 
            }
        }

        // Final slice
        currentCanvas.height = Math.round((totalNativeHeight - sliceStartY) * scaleFactor);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0, currentCanvas.width, currentCanvas.height);
        
        for(let j = images.length - 1; j >= 0; j--) {
            let drawY = yOffsets[j] - sliceStartY;
            if (drawY + images[j].height > 0) {
                ctx.drawImage(images[j], 0, drawY * scaleFactor, outWidth, images[j].height * scaleFactor);
            }
        }

        // Updated Watermark logic on final slice
        if (watermarkImg) {
            let wmWidth = Math.min(outWidth * 0.3, watermarkImg.width);
            let wmHeight = watermarkImg.height * (wmWidth / watermarkImg.width);
            ctx.globalAlpha = 0.3; // Changed to 30%
            ctx.drawImage(watermarkImg, outWidth - wmWidth - 20, currentCanvas.height - wmHeight - 20, wmWidth, wmHeight);
            ctx.globalAlpha = 1.0;
        }

        await exportCanvasToZip(currentCanvas, chFolderObj, sliceIndex, format, quality);
        epFiles.forEach(f => URL.revokeObjectURL(f));
    }

    async function exportCanvasToZip(canvas, folder, index, format, quality) {
        return new Promise((resolve) => {
            canvas.toBlob((blob) => {
                let ext = format === 'image/webp' ? 'webp' : (format === 'image/jpeg' ? 'jpg' : 'png');
                let filename = `${index.toString().padStart(3, '0')}.${ext}`;
                folder.file(filename, blob);
                resolve();
            }, format, quality);
        });
    }

    async function startProcess() {
        if (chaptersData.length === 0) {
            alert("Please select a main folder containing subfolders.");
            return;
        }

        let zipInputVal = document.getElementById('zip-name').value.trim();
        let finalZipName = zipInputVal || `Merged_Chapters_${Date.now()}`;
        
        // Smart Chapter Number Detection (Extracts 81 from mkd81-85)
        let startingChapter = 1;
        const numberMatch = zipInputVal.match(/\d+/); 
        if (numberMatch) {
            startingChapter = parseInt(numberMatch[0]);
        }

        document.getElementById('merge-btn').disabled = true;
        logDebug(`[System] Processing starting from Chapter ${startingChapter}`);
        
        const zip = new JSZip();

        try {
            for (let i = 0; i < chaptersData.length; i++) {
                // Determine folder name inside zip (e.g. "ch81", "ch82")
                let currentChNum = startingChapter + i;
                let chFolderName = `ch${currentChNum}`;
                let chFolderObj = zip.folder(chFolderName);
                
                updateProgress((i / chaptersData.length) * 80, `Processing ${chFolderName}...`);
                await processEpisode(chaptersData[i].files, chFolderName, chFolderObj);
            }

            updateProgress(85, "Zipping files...");
            const content = await zip.generateAsync({ type: "blob" }, function updateCallback(metadata) {
                let prog = 85 + (metadata.percent / 100 * 15);
                updateProgress(prog, `Compressing... ${metadata.percent.toFixed(1)}%`);
            });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${finalZipName}.zip`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            updateProgress(100, "Completed Successfully!");
        } catch (err) {
            console.error(err);
            logDebug(`[ERROR] ${err.message}`);
            alert("An error occurred during processing. Check Debug console.");
        } finally {
            document.getElementById('merge-btn').disabled = false;
        }
    }
</script>

</body>
</html>
